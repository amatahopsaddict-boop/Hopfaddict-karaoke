<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOPFADDICT AMATA | TV Karaoke</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#050b15;color:#fff;font-family:system-ui,'Noto Sans Thai',sans-serif}.top{height:60px;display:flex;justify-content:space-between;align-items:center;padding:8px 22px;background:#0d1b2d;border-bottom:2px solid #bb8d41;color:#f4cc7a}.top strong{font-size:clamp(14px,2vw,25px)}.screen{height:calc(100dvh - 110px);display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:12px;padding:12px}.player{background:black;border-radius:10px;position:relative;overflow:hidden;display:grid;place-items:center}.player iframe,.player video{width:100%;height:100%;border:0}.player [hidden]{display:none!important}.player #youtube{position:absolute;inset:0;z-index:2;background:#000}.player #media{position:absolute;inset:0;z-index:2;background:#000}.player #poster{z-index:1}.placeholder{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:radial-gradient(circle,#1e3952,#040811);font-size:clamp(18px,3vw,40px)}.placeholder small{font-size:14px;color:#b5c5d8}.aside{border:1px solid #3d4a57;border-radius:12px;background:#112136;padding:15px;overflow:auto}.aside h3{color:#f4cc7a;margin-top:0}.qr{background:white;padding:12px;width:max-content;max-width:100%;margin:auto;border-radius:8px}.qr img{display:block;max-width:100%}.status{color:#edc36e;font-size:12px;overflow-wrap:anywhere}.next{padding:10px 0;border-bottom:1px solid #33465b}.footer{height:50px;padding:10px 20px;background:#0d1b2d;color:#d8bd8b;display:flex;justify-content:space-between;align-items:center;gap:10px}.footer button{border:1px solid #9f783d;background:#1c3148;color:white;border-radius:7px;padding:7px 10px}@media(max-width:750px){.screen{grid-template-columns:1fr;height:auto}.player{aspect-ratio:16/9}.aside{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.top{height:auto;min-height:60px}.footer{height:auto}}
</style></head><body><div class="top"><strong>🎤 HOPFADDICT AMATA · KARAOKE TV</strong><span id="nowTitle">พร้อมร้องเพลง</span></div><div class="screen"><main class="player" id="videoBox"><div class="placeholder" id="poster"><b>STOP THINKING<br>START SINGING</b><small>สแกน QR เพื่อเลือกเพลงจากมือถือ</small></div><video id="media" hidden playsinline controls></video><div id="youtube" style="width:100%;height:100%" hidden></div><button id="startYoutube" hidden style="position:absolute;z-index:9;bottom:20px;left:50%;transform:translateX(-50%);background:#d6a54b;color:#071522;border:0;border-radius:12px;padding:14px 22px;font-weight:800;font-size:18px;cursor:pointer">▶ กดเพื่อเริ่มวิดีโอ</button></main><aside class="aside"><div><h3>📱 สแกนเพื่อเลือกเพลง</h3><div class="qr" id="firebaseQr"></div><p>รหัสห้อง <b id="roomCode">...</b></p><p class="status" id="firebaseStatus">กำลังเชื่อมต่อ...</p></div><div style="min-width:160px;flex:1"><h3>♫ เพลงถัดไป</h3><div id="queueList">ยังไม่มีเพลงในคิว</div></div></aside></div><div class="footer"><span id="playStatus">รอเลือกเพลง</span><button onclick="document.getElementById('videoBox').requestFullscreen?.()">⛶ เต็มจอ</button></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="firebase-config.js"></script><script>
let queue=[],current=null,ytPlayer=null,volume=70,ytTries=0;const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){ $('nowTitle').textContent=current?.title||'พร้อมร้องเพลง';$('queueList').innerHTML=queue.length?queue.map((s,i)=>'<div class="next">'+(i+1)+'. '+esc(s.title)+'</div>').join(''):'ยังไม่มีเพลงในคิว';}function update(){render();window.dispatchEvent(new Event('hopf-state-change'));}function playCurrent(){if(!current)return;$('startYoutube').hidden=true; $('poster').hidden=true;$('media').hidden=true;$('youtube').hidden=true;if(current.demo){$('poster').hidden=false;$('playStatus').textContent='เพลงตัวอย่างไม่มีเสียง กรุณาค้นหาเพลงจริง';return;}if(current.url){$('media').hidden=false;$('media').src=current.url;$('media').volume=volume/100;$('media').play().catch(()=>{$('playStatus').textContent='กดเล่นบนทีวีเพื่อเริ่ม'});return;}if(current.id){$('youtube').hidden=false;$('youtube').innerHTML='<div id="ytMount"></div>';ytPlayer=null; if(!/^[a-zA-Z0-9_-]{11}$/.test(current.id)){ $('playStatus').textContent='รหัสวิดีโอไม่ถูกต้อง: '+String(current.id).slice(0,40);$('startYoutube').hidden=true;return;}if(window.YT?.Player){ytTries=0;ytPlayer=new YT.Player('ytMount',{videoId:current.id,width:'100%',height:'100%',playerVars:{playsinline:1,origin:location.origin},events:{onReady:e=>{e.target.setVolume(volume);e.target.playVideo();$('startYoutube').hidden=false;$('playStatus').textContent='ส่งคำสั่งเล่นแล้ว · ถ้าไม่เริ่ม ให้กดปุ่ม ▶ บนจอ'},onError:e=>{$('startYoutube').hidden=false;$('playStatus').textContent='YouTube เล่นไม่ได้ (รหัส '+e.data+') — ลองเพลงอื่นที่อนุญาตให้ฝัง'},onStateChange:e=>{if(e.data===0)nextSong();if(e.data===1){$('startYoutube').hidden=true;$('playStatus').textContent='กำลังเล่น YouTube Karaoke'}}}});}else{$('playStatus').textContent='กำลังโหลด YouTube Player…';setTimeout(()=>{if(current?.id){if(++ytTries>12){$('playStatus').textContent='โหลด YouTube Player ไม่สำเร็จ ตรวจอินเทอร์เน็ต/เบราว์เซอร์';$('startYoutube').hidden=false;}else playCurrent()}},900);return}$('playStatus').textContent='กำลังโหลด YouTube Karaoke';}}$('startYoutube').addEventListener('click',()=>{if(ytPlayer?.playVideo){ytPlayer.playVideo();$('playStatus').textContent='กำลังเริ่มเล่นจากหน้าจอ…';}else if(current?.id){if(++ytTries>12){$('playStatus').textContent='โหลด YouTube Player ไม่สำเร็จ ตรวจอินเทอร์เน็ต/เบราว์เซอร์';$('startYoutube').hidden=false;}else playCurrent()}});function nextSong(){if(queue.length){current=queue.shift();update();playCurrent()}else{current=null;$('media').pause();$('media').hidden=true;$('youtube').hidden=true;$('poster').hidden=false;$('startYoutube').hidden=true;update();$('playStatus').textContent='จบคิวเพลงแล้ว';}}function toggle(){if(!$('media').hidden){$('media').paused?$('media').play():$('media').pause()}else if(ytPlayer?.getPlayerState){ytPlayer.getPlayerState()===1?ytPlayer.pauseVideo():ytPlayer.playVideo()}}window.hopfGetState=()=>({queue:JSON.stringify(queue),current:JSON.stringify(current),volume,version:Date.now()});window.hopfReceiveCommand=(cmd,p={})=>{if(cmd==='add'&&p.song&&typeof p.song.title==='string'&&queue.length<100){queue.push({id:String(p.song.id||'').slice(0,100),title:p.song.title.slice(0,200),artist:String(p.song.artist||'').slice(0,120),demo:!!p.song.demo,url:p.song.url});update()}else if(cmd==='play')nextSong();else if(cmd==='next')nextSong();else if(cmd==='toggle')toggle();else if(cmd==='volume'){volume=Math.max(0,Math.min(100,Number(p.value)||0));$('media').volume=volume/100;if(ytPlayer?.setVolume)ytPlayer.setVolume(volume);update()}else if(cmd==='remove'&&Number.isInteger(p.index)&&p.index>=0&&p.index<queue.length){queue.splice(p.index,1);update()}else if(cmd==='up'&&Number.isInteger(p.index)&&p.index>0&&p.index<queue.length){[queue[p.index-1],queue[p.index]]=[queue[p.index],queue[p.index-1]];update()}};$('media').addEventListener('ended',nextSong);render();
</script><script src="https://www.youtube.com/iframe_api"></script><script type="module" src="firebase-sync.js"></script></body></html>
