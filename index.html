<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOPFADDICT KARAOKE · Remote</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<header class="top"><div class="brand">🎤 HOPFADDICT AMATA<small>KARAOKE PRO V3 · REMOTE</small></div><span class="muted"><i class="dot" id="dot"></i><span id="online">…</span></span></header>
<main class="wrap">
<section class="panel"><h3>🎵 กำลังเล่น</h3><b id="now" style="font-size:18px;overflow-wrap:anywhere">ยังไม่มีเพลง</b>
<div class="controls"><button class="hot" id="play">▶ เล่น</button><button id="toggle">⏯ หยุด/ต่อ</button><button id="next">⏭ ข้าม</button></div>
<label>🔊 เสียง <b id="vl">70%</b><input id="vol" type="range" min="0" max="100" value="70"></label></section>
<section class="panel"><h3>🔎 เพิ่มเพลง</h3><div class="row"><input id="q" placeholder="ชื่อเพลง/ศิลปิน หรือวางลิงก์ YouTube" enterkeyhint="search"><button class="hot" id="go">ค้นหา</button></div>
<p class="status" id="hint">วางลิงก์ YouTube เพื่อเพิ่มคิวทันที หรือพิมพ์ชื่อเพลงเพื่อค้นหา <button id="gear" style="padding:4px 10px">⚙ API Key</button></p>
<div class="row" id="keybox" style="display:none;margin-bottom:8px"><input id="key" placeholder="YouTube Data API v3 Key"><button id="savekey">บันทึก</button></div><div id="results"></div></section>
<section class="panel"><h3>☷ คิวเพลง</h3><div id="queue" class="muted">ยังไม่มีเพลงในคิว</div></section></main><div class="toast" id="toast"></div>
<script src="firebase-config.js"></script><script type="module" src="remote.js"></script></body></html>
